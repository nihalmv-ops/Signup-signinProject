<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up | Travel App</title>

    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Custom CSS -->

    <link rel="stylesheet" href="css/style.css">

</head>


<body class="auth-page">


    <main class="auth-container">

        <section class="auth-card">

            <div class="auth-header">

                <h1>✈️ Travel App</h1>

                <h2>Create Account</h2>

                <p>Join us and start your journey</p>

            </div>


            <form id="signupForm" novalidate>


                <!-- Full Name -->

                <div class="mb-3">

                    <label for="fullName" class="form-label">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="fullName"
                        class="form-control"
                        placeholder="Enter your full name"
                        required
                    >

                    <small
                        id="fullNameError"
                        class="error-message">
                    </small>

                </div>


                <!-- Email -->

                <div class="mb-3">

                    <label for="email" class="form-label">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        class="form-control"
                        placeholder="example@mail.com"
                        required
                    >

                    <small
                        id="emailError"
                        class="error-message">
                    </small>

                </div>


                <!-- Phone -->

                <div class="mb-3">

                    <label for="phone" class="form-label">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        class="form-control"
                        placeholder="10 digit phone number"
                        maxlength="10"
                        required
                    >

                    <small
                        id="phoneError"
                        class="error-message">
                    </small>

                </div>


                <!-- Location -->

                <div class="mb-3">

                    <label for="location" class="form-label">
                        Location / City
                    </label>

                    <input
                        type="text"
                        id="location"
                        class="form-control"
                        placeholder="Enter your city"
                        required
                    >

                    <small
                        id="locationError"
                        class="error-message">
                    </small>

                </div>


                <!-- Password -->

                <div class="mb-3">

                    <label for="password" class="form-label">
                        Password
                    </label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="password"
                            class="form-control"
                            placeholder="Minimum 8 characters"
                            required
                        >

                        <button
                            type="button"
                            class="show-password"
                            id="togglePassword">

                            Show

                        </button>

                    </div>

                    <small
                        id="passwordError"
                        class="error-message">
                    </small>

                </div>


                <!-- Confirm Password -->

                <div class="mb-3">

                    <label for="confirmPassword" class="form-label">
                        Confirm Password
                    </label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="confirmPassword"
                            class="form-control"
                            placeholder="Confirm your password"
                            required
                        >

                        <button
                            type="button"
                            class="show-password"
                            id="toggleConfirmPassword">

                            Show

                        </button>

                    </div>

                    <small
                        id="confirmPasswordError"
                        class="error-message">
                    </small>

                </div>


                <button
                    type="submit"
                    class="btn btn-primary w-100 signup-btn">

                    Create Account

                </button>


                <p class="redirect-text">

                    Already have an account?

                    <a href="SignIn.html">
                        Sign In
                    </a>

                </p>

            </form>

        </section>

    </main>


    <script src="js/index.js"></script>

</body>

</html>
