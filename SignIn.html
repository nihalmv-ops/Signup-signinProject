<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign In | Travel App</title>

    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Custom CSS -->

    <link rel="stylesheet" href="css/style.css">

</head>


<body class="auth-page">


    <main class="auth-container">

        <section class="auth-card">


            <div class="auth-header">

                <h1>✈️ Travel App</h1>

                <h2>Welcome Back!</h2>

                <p>Sign in to continue your journey</p>

            </div>


            <form id="signinForm" novalidate>


                <!-- Email -->

                <div class="mb-3">

                    <label
                        for="signinEmail"
                        class="form-label">

                        Email

                    </label>


                    <input
                        type="email"
                        id="signinEmail"
                        class="form-control"
                        placeholder="example@mail.com"
                        required
                    >


                    <small
                        id="signinEmailError"
                        class="error-message">
                    </small>

                </div>


                <!-- Password -->

                <div class="mb-3">

                    <label
                        for="signinPassword"
                        class="form-label">

                        Password

                    </label>


                    <div class="password-box">

                        <input
                            type="password"
                            id="signinPassword"
                            class="form-control"
                            placeholder="Enter your password"
                            required
                        >


                        <button
                            type="button"
                            class="show-password"
                            id="toggleSigninPassword">

                            Show

                        </button>

                    </div>


                    <small
                        id="signinPasswordError"
                        class="error-message">
                    </small>

                </div>


                <!-- Login Button -->

                <button
                    type="submit"
                    class="btn btn-primary w-100 signup-btn">

                    Sign In

                </button>


                <p class="redirect-text">

                    Don't have an account?

                    <a href="SignUp.html">
                        Create Account
                    </a>

                </p>


            </form>

        </section>

    </main>


    <script src="js/index.js"></script>

</body>

</html>
